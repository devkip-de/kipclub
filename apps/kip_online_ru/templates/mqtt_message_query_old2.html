<!-- apps/kip_online_ru/templates/mqtt_message_query.html -->

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Фильтрация сообщений</title>
</head>
<body>
    <h1>Фильтрация сообщений MQTT</h1>

    <form method="get" action="{% url 'mqtt_message_query' %}">
        <div>
            <label for="topic_root">Корневой узел топика:</label>
            <input type="text" id="topic_root" name="topic_root" value="{{ request.GET.topic_root|default_if_none:'' }}">
        </div>

        <div>
            <label for="start_time">Время начала:</label>
            <input type="datetime-local" id="start_time" name="start_time" value="{{ request.GET.start_time|default_if_none:'' }}">
        </div>

        <div>
            <label for="end_time">Время окончания:</label>
            <input type="datetime-local" id="end_time" name="end_time" value="{{ request.GET.end_time|default_if_none:'' }}">
        </div>

        <div>
            <button type="submit">Применить фильтры</button>
            <button type="button" onclick="window.location.href='{% url 'mqtt_message_query' %}';">Очистить фильтр</button>
        </div>
    </form>

    <h2>Результаты</h2>
    {% if messages %}
        <ul>
        {% for message in messages %}
            <li>{{ message.client_id }} - {{ message.topic }} - {{ message.time_stamp }}</li>
        {% endfor %}
        </ul>
    {% else %}
        <p>Сообщений не найдено.</p>
    {% endif %}
</body>
</html>
